<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Media Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .active-tab {
      color: #38bdf8;
    }
    .active-tab i {
      transform: translateY(-2px);
      transition: transform 0.2s ease;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body class="pb-20">

  <!-- Header -->
  <header class="p-4 border-b border-gray-800 bg-gray-900/80 sticky top-0 backdrop-blur z-20">
    <h1 id="page-title" class="text-lg font-bold text-center text-sky-400">Recaps Studio</h1>
  </header>

  <!-- Pages Content Area -->
  <main class="max-w-md mx-auto p-4">
    <!-- Tab 1: Recaps Studio -->
    <section id="view-recaps" class="tab-content active"></section>

    <!-- Tab 2: Motion Video -->
    <section id="view-motion" class="tab-content"></section>

    <!-- Tab 3: Story Creator -->
    <section id="view-story" class="tab-content"></section>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-gray-900/95 border-t border-gray-800 backdrop-blur z-30">
    <div class="max-w-md mx-auto flex justify-around items-center h-16">
      
      <button onclick="switchTab('recaps')" id="tab-btn-recaps" class="flex flex-col items-center justify-center w-full h-full text-xs text-gray-400 active-tab">
        <i class="fa-solid fa-clapperboard text-lg mb-1"></i>
        <span>Recaps</span>
      </button>

      <button onclick="switchTab('motion')" id="tab-btn-motion" class="flex flex-col items-center justify-center w-full h-full text-xs text-gray-400">
        <i class="fa-solid fa-wand-magic-sparkles text-lg mb-1"></i>
        <span>Motion</span>
      </button>

      <button onclick="switchTab('story')" id="tab-btn-story" class="flex flex-col items-center justify-center w-full h-full text-xs text-gray-400">
        <i class="fa-solid fa-book-open text-lg mb-1"></i>
        <span>Story</span>
      </button>

    </div>
  </nav>

  <!-- JS Modules ခေါ်ယူခြင်း -->
  <script src="recaps.js"></script>
  <script src="motion.js"></script>
  <script src="story.js"></script>

  <script>
    function switchTab(tabId) {
      // Content ဖျောက်/ပြ လုပ်ခြင်း
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(`view-${tabId}`).classList.add('active');

      // Nav icon အရောင်ပြောင်းခြင်း
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active-tab'));
      document.getElementById(`tab-btn-${tabId}`).classList.add('active-tab');

      // Title ပြောင်းခြင်း
      const titles = {
        recaps: 'Recaps Studio',
        motion: 'Motion Video',
        story: 'Story Creator'
      };
      document.getElementById('page-title').innerText = titles[tabId];
    }

    // App စဖွင့်ချိန်တွင် Views များ Render ပြုလုပ်ခြင်း
    window.addEventListener('DOMContentLoaded', () => {
      initRecapsView();
      initMotionView();
      initStoryView();
    });
  </script>
</body>
</html>
