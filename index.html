<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burmese Movie Recap Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .title-box {
      text-align: center;
      margin-bottom: 8px;
    }
    .title-box h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    input[type="file"] {
      width: 100%;
      padding: 10px;
      background-color: #0d1117;
      border: 1px dashed #30363d;
      border-radius: 8px;
      color: #8b949e;
      font-size: 0.9rem;
    }
    input[type="file"]::-webkit-file-upload-button {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 10px;
    }
    #processBtn {
      background-color: #238636;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    #processBtn:hover {
      background-color: #2ea043;
    }
    #processBtn:disabled {
      background-color: #343942;
      color: #8b949e;
      cursor: not-allowed;
    }
    #status {
      font-size: 0.92rem;
      color: #e3b341;
      line-height: 1.5;
      text-align: center;
      min-height: 24px;
      word-break: break-word;
    }
    #scriptBox {
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px;
      font-size: 0.92rem;
      line-height: 1.6;
      color: #c9d1d9;
      white-space: pre-wrap;
    }
    video {
      width: 100%;
      border-radius: 8px;
      background-color: #000;
      border: 1px solid #30363d;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="title-box">
      <h1>🎬 Burmese Movie Recap Studio</h1>
    </div>

    <div class="card">
      <input type="file" id="videoInput" accept="video/mp4,video/*">
      <button id="processBtn">Recap ဗီဒီယို ဖန်တီးမည်</button>
      <div id="status"></div>
    </div>

    <div id="scriptBox" class="hidden"></div>
    <video id="outputVideo" controls class="hidden"></video>
  </div>

  <!-- Cache လုံးဝ မငြိစေရန် ?v=3 အမှတ်အသား ထည့်သွင်းထားပါသည် -->
  <script type="module" src="./app.js?v=3"></script>
</body>
</html>
