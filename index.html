<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burmese Movie Recap Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6 flex flex-col items-center">
  <div class="max-w-xl w-full space-y-4">
    <h1 class="text-2xl font-bold text-center">🎬 Burmese Movie Recap Studio</h1>
    <input type="file" id="videoInput" accept="video/*" class="w-full p-2 bg-gray-800 rounded border border-gray-700">
    <button id="processBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded font-bold">Recap ဗီဒီယို ဖန်တီးမည်</button>
    <div id="status" class="text-sm text-yellow-400"></div>
    <div id="scriptBox" class="p-3 bg-gray-800 rounded text-sm hidden"></div>
    <video id="outputVideo" controls class="w-full rounded hidden"></video>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
