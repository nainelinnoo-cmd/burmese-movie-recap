<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Media Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 80px;
    }
    header {
      position: sticky;
      top: 0;
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #1e293b;
      padding: 16px;
      text-align: center;
      z-index: 20;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    /* Cards & Form Elements */
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    input[type="text"], select, textarea {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 12px;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: #38bdf8;
    }
    input[type="file"] {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s;
    }
    .btn-recap { background-color: #10b981; color: #fff; }
    .btn-motion { background-color: #8b5cf6; color: #fff; }
    .btn-story { background-color: #0ea5e9; color: #fff; }
    .btn:active { opacity: 0.85; }

    /* Bottom Nav Bar */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background-color: rgba(15, 23, 42, 0.95);
      border-top: 1px solid #1e293b;
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 30;
      max-width: 480px;
      margin: 0 auto;
    }
    nav button {
      background: none;
      border: none;
      color: #64748b;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      width: 33.33%;
    }
    nav button .nav-icon {
      font-size: 1.25rem;
    }
    nav button.active-tab {
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="page-title">Recaps Studio</h1>
  </header>

  <main>
    <section id="view-recaps" class="tab-content active"></section>
    <section id="view-motion" class="tab-content"></section>
    <section id="view-story" class="tab-content"></section>
  </main>

  <nav>
    <button onclick="switchTab('recaps')" id="tab-btn-recaps" class="active-tab">
      <span class="nav-icon">🎬</span>
      <span>Recaps</span>
    </button>
    <button onclick="switchTab('motion')" id="tab-btn-motion">
      <span class="nav-icon">✨</span>
      <span>Motion</span>
    </button>
    <button onclick="switchTab('story')" id="tab-btn-story">
      <span class="nav-icon">📖</span>
      <span>Story</span>
    </button>
  </nav>

  <script src="recaps.js"></script>
  <script src="motion.js"></script>
  <script src="story.js"></script>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + tabId).classList.add('active');

      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active-tab'));
      document.getElementById('tab-btn-' + tabId).classList.add('active-tab');

      const titles = {
        recaps: 'Recaps Studio',
        motion: 'Motion Video',
        story: 'Story Creator'
      };
      document.getElementById('page-title').innerText = titles[tabId];
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof initRecapsView === "function") initRecapsView();
      if (typeof initMotionView === "function") initMotionView();
      if (typeof initStoryView === "function") initStoryView();
    });
  </script>
</body>
</html>
